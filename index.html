<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Mô Hình 3D Online</title>
  <!-- Nhập thư viện model-viewer chính thức của Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #f5f5f7;
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- Thẻ hiển thị mô hình 3D -->
  <model-viewer 
    src="ray175.glb" 
    alt="Mô hình 3D SolidWorks"
    auto-rotate 
    camera-controls 
    ar 
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
