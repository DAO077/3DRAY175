<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eDrawings Web Viewer</title>
  <!-- Nhập thư viện model-viewer của Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <!-- Nhập FontAwesome cho icon giao diện eDrawings -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      /* Background dải màu xám xịn xò đặc trưng của SolidWorks/eDrawings */
      background: radial-gradient(circle at center, #5a626e 0%, #1e242d 100%);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Thanh Header trên cùng kiểu eDrawings */
    .header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: rgba(20, 24, 30, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.5px;
    }

    .brand i {
      color: #0088ff;
      font-size: 18px;
    }

    /* Thanh công cụ đệm phía dưới (Bottom Toolbar) */
    .toolbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 28, 35, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 12px;
      display: flex;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .tool-btn {
      background: transparent;
      border: none;
      color: #cccccc;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s ease;
      position: relative;
    }

    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .tool-btn.active {
      background: #0088ff;
      color: #ffffff;
    }

    .divider {
      width: 1px;
      height: 24px;
      background: rgba(255, 255, 255, 0.15);
      align-self: center;
      margin: 0 4px;
    }

    /* Tooltip chú thích khi di chuột vào nút */
    .tool-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      background: #10141a;
      color: #fff;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tool-btn:hover::after {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Header eDrawings -->
  <div class="header-bar">
    <div class="brand">
      <i class="fa-solid fa-cube"></i>
      <span>eDrawings Web Viewer</span>
    </div>
  </div>

  <!-- Khung xem 3D -->
  <model-viewer 
    id="viewer"
    src="ray175.glb" 
    alt="3D Model"
    camera-controls 
    shadow-intensity="1.5"
    shadow-softness="0.5"
    exposure="1"
    interaction-prompt="none">
  </model-viewer>

  <!-- Thanh công cụ điều khiển kiểu eDrawings -->
  <div class="toolbar">
    <!-- Nút Home / Iso View -->
    <button class="tool-btn" data-tooltip="Isometric View" onclick="setView('45deg 55deg 100%')">
      <i class="fa-solid fa-house"></i>
    </button>
    
    <div class="divider"></div>

    <!-- Các hướng nhìn chuẩn (Standard Views) -->
    <button class="tool-btn" data-tooltip="Front View" onclick="setView('0deg 90deg 100%')">
      <i class="fa-solid fa-square"></i>
    </button>
    <button class="tool-btn" data-tooltip="Top View" onclick="setView('0deg 0deg 100%')">
      <i class="fa-solid fa-border-all"></i>
    </button>
    <button class="tool-btn" data-tooltip="Right View" onclick="setView('90deg 90deg 100%')">
      <i class="fa-solid fa-square-minus"></i>
    </button>

    <div class="divider"></div>

    <!-- Tự động xoay -->
    <button id="rotateBtn" class="tool-btn" data-tooltip="Auto Rotate" onclick="toggleRotate()">
      <i class="fa-solid fa-rotate"></i>
    </button>

    <!-- Reset vị trí Zoom -->
    <button class="tool-btn" data-tooltip="Reset Zoom" onclick="resetZoom()">
      <i class="fa-solid fa-expand"></i>
    </button>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const rotateBtn = document.getElementById('rotateBtn');
    let isRotating = false;

    // Hàm chuyển đổi hướng nhìn (View)
    function setView(orbit) {
      viewer.cameraOrbit = orbit;
      viewer.jumpToGoal();
    }

    // Bật/tắt tự động xoay
    function toggleRotate() {
      isRotating = !isRotating;
      if (isRotating) {
        viewer.autoRotate = true;
        rotateBtn.classList.add('active');
      } else {
        viewer.autoRotate = false;
        rotateBtn.classList.remove('active');
      }
    }

    // Reset góc nhìn ban đầu
    function resetZoom() {
      viewer.cameraTarget = 'auto auto auto';
      viewer.cameraOrbit = '45deg 55deg 100%';
    }
  </script>
</body>
</html>
